<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOIR – Shopping Bag</title>

  <script>document.documentElement.classList.add('js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://images.unsplash.com">

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --grey: rgba(255, 255, 255, 0.6);
      --line: rgba(255, 255, 255, 0.18);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --gutter: clamp(1.25rem, 4vw, 3rem);
      --header-h: 4.5rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { scroll-behavior: smooth; }
    
    body {
  background: var(--black);
  color: var(--white);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* HEADER */
    .header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 50;
      height: var(--header-h);
      padding: 0 var(--gutter);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .header__logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      justify-self: start;
    }

    .header__nav {
      display: flex;
      gap: clamp(1.25rem, 4vw, 3rem);
    }

    .header__nav a {
      position: relative;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .header__nav a::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s ease;
    }

    .header__nav a:hover::after { transform: scaleX(1); }

    .header__cart {
      justify-self: end;
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      position: relative;
    }

    .header__cart svg { width: 22px; height: 22px; }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--white);
      color: var(--black);
      font-size: 0.65rem;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.3s, transform 0.3s;
    }

    .cart-badge.active { opacity: 1; transform: scale(1); }

    /* CART LAYOUT */
    .cart-container {
      padding: calc(var(--header-h) + 4rem) var(--gutter) 6rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .cart-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      margin-bottom: 3rem;
      letter-spacing: -0.01em;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 1.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--line);
      align-items: start;
    }

    .cart-item__img {
      width: 100px;
      aspect-ratio: 3/4;
      object-fit: cover;
      background: #111;
    }

    .cart-item__details h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .cart-item__meta {
      font-size: 0.85rem;
      color: var(--grey);
      margin-bottom: 0.5rem;
    }

    .cart-item__price {
      font-size: 1rem;
      font-weight: 500;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: var(--grey);
      cursor: pointer;
      font-size: 1.2rem;
      transition: color 0.3s;
      padding: 0.25rem;
    }

    .remove-btn:hover { color: var(--white); }

    .empty-cart {
      text-align: center;
      padding: 4rem 0;
    }

    .empty-cart p {
      color: var(--grey);
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .empty-cart .btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: var(--white);
      color: var(--black);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .cart-summary {
      background: #0a0a0a;
      padding: 2.5rem;
      border: 1px solid var(--line);
      position: sticky;
      top: calc(var(--header-h) + 2rem);
    }

    .cart-summary h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: var(--grey);
    }

    .summary-row.total {
      font-size: 1.2rem;
      color: var(--white);
      font-weight: 500;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }

    .checkout-btn {
      width: 100%;
      margin-top: 2rem;
      padding: 1.2rem;
      background: var(--white);
      color: var(--black);
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
    }

    .checkout-btn:hover { background: #ddd; }

    @media (max-width: 768px) {
      .cart-layout { grid-template-columns: 1fr; gap: 2rem; }
      .header { padding: 0 1rem; }
      .header__nav { display: none; }
      .cart-item { grid-template-columns: 80px 1fr auto; gap: 1rem; }
      .cart-item__img { width: 80px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="header__logo">NOIR</a>
    <nav class="header__nav">
      <a href="woman.html">Women</a>
      <a href="men.html">Men</a>
      <a href="kids.html">Kids</a>
    </nav>
    <a href="cart.html" class="header__cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 8h14l-1 12H6L5 8Z"/>
        <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
      </svg>
      <span class="cart-badge" id="cartBadge">0</span>
    </a>
  </header>

  <main class="cart-container">
    <h1 class="cart-title">Shopping Bag</h1>

    <div class="cart-layout" id="cartLayout"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="transitions.js"></script>
  <script>
    (() => {
      const cartLayout = document.getElementById('cartLayout');

      // Cart Badge
      function updateCartBadge() {
        const badge = document.getElementById('cartBadge');
        if (!badge) return;
        const cart = JSON.parse(localStorage.getItem('noirCart')) || [];
        const count = cart.length;
        badge.textContent = count;
        if (count > 0) badge.classList.add('active');
        else badge.classList.remove('active');
      }
      updateCartBadge();

      function renderCart() {
        const cart = JSON.parse(localStorage.getItem('noirCart')) || [];

        if (cart.length === 0) {
          cartLayout.innerHTML = `
            <div class="empty-cart" style="grid-column: 1 / -1;">
              <p>Your bag is empty.</p>
              <a href="index.html" class="btn">Continue Shopping</a>
            </div>
          `;
          return;
        }

        const itemsHTML = cart.map((item, index) => `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}" class="cart-item__img">
            <div class="cart-item__details">
              <h3>${item.name}</h3>
              <p class="cart-item__meta">Size: ${item.size} | Color: ${item.color}</p>
              <p class="cart-item__price">${item.price}</p>
            </div>
            <button class="remove-btn" data-index="${index}" aria-label="Remove item">&times;</button>
          </div>
        `).join('');

        const total = cart.reduce((sum, item) => {
          const numericPrice = parseFloat(item.price.replace(/[^\d.]/g, ''));
          return sum + (isNaN(numericPrice) ? 0 : numericPrice);
        }, 0);

        cartLayout.innerHTML = `
          <div class="cart-items">
            ${itemsHTML}
          </div>
          <div class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-row">
              <span>Subtotal</span>
              <span>€${total.toFixed(2)}</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span>Calculated at checkout</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span>€${total.toFixed(2)}</span>
            </div>
            <button class="checkout-btn">Proceed to Checkout</button>
          </div>
        `;

        cartLayout.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const index = parseInt(btn.dataset.index);
            const updatedCart = cart.filter((_, i) => i !== index);
            localStorage.setItem('noirCart', JSON.stringify(updatedCart));
            updateCartBadge();
            renderCart();
          });
        });
      }

      renderCart();
    })();
  </script>
</body>
</html>
